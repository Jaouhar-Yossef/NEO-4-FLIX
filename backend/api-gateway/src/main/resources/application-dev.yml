
server:
  port: 8080

logging:
  level:
    root: INFO
    com.neo4flix: DEBUG

spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/users/**
              filters:
                - StripPrefix=1

            - id: movie-service
              uri: http://localhost:8182
              predicates:
                - Path=/api/movies/**
              filters:
                - StripPrefix=1

            - id: rating-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/ratings/**
              filters:
                - StripPrefix=1

            - id: recommendation-service
              uri: http://localhost:8084
              predicates:
                - Path=/api/recommendations/**
              filters:
                - StripPrefix=1

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    gateway:
      access: read-only
