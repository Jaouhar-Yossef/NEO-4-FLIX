services:
  neo4j:
    image: neo4j:5-community
    container_name: neo4flix-neo4j
    restart: unless-stopped

    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"

    environment:
      NEO4J_AUTH: "${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:?NEO4J_PASSWORD is required}"

    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

    healthcheck:
      test:
        - CMD-SHELL
        - "cypher-shell -u $${NEO4J_AUTH%%/*} -p $${NEO4J_AUTH#*/} 'RETURN 1' || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

volumes:
  neo4j_data:
  neo4j_logs: