# nginx is the only published container (ADR 0001): it serves the Angular build and
# forwards /api to the gateway. Same origin for the browser, so no CORS is needed here.
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  # Do not show the nginx version in errors and headers.
  server_tokens off;

  # No trailing slash after the port: the path is forwarded unchanged (/api/...),
  # the gateway strips /api itself.
  location /api/ {
    proxy_pass http://api-gateway:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Angular routes (/login, /profile...) are not files: send index.html and let the
  # router handle them.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
